apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: developer-role
  namespace: dev

rules:

- apiGroups: ["apps"]

  resources:
    - deployments
    - replicasets

  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch

- apiGroups: [""]

  resources:
    - pods
    - services
    - configmaps

  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch

- apiGroups: ["networking.k8s.io"]

  resources:
    - ingresses

  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch