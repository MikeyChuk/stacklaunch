services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: stacklaunch-sqs-app:v1

    container_name: stacklaunch-sqs-api

    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      AWS_SHARED_CREDENTIALS_FILE: /home/stacklaunch/.aws/credentials
      AWS_CONFIG_FILE: /home/stacklaunch/.aws/config

    volumes:
      - ${HOME}/.aws:/home/stacklaunch/.aws:ro

    restart: unless-stopped

  worker:
    image: stacklaunch-sqs-app:v1

    # container_name: stacklaunch-sqs-worker

    command:
      - python
      - worker.py

    env_file:
      - .env

    environment:
      AWS_SHARED_CREDENTIALS_FILE: /home/stacklaunch/.aws/credentials
      AWS_CONFIG_FILE: /home/stacklaunch/.aws/config

    volumes:
      - ${HOME}/.aws:/home/stacklaunch/.aws:ro

    restart: unless-stopped

    depends_on:
      - api